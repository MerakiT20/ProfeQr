name: Modularize ProfeQr

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modularize.yml'

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build modular application
        run: python3 .github/scripts/modularize_profeqr.py
      - name: Validate JavaScript
        run: |
          set -e
          for f in js/*.js sw.js; do node --check "$f"; done
          test ! -e app.js
          test -f icons/icon-192.png
          test -f icons/icon-512-maskable.png
      - name: Commit modular version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Modularize ProfeQr application"
          git push origin HEAD:main
