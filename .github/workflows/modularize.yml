name: Modularize ProfeQr

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modularize.yml'

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build modular application
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, struct, zlib, binascii

          root = Path('.')
          app_path = root / 'app.js'
          app = app_path.read_text(encoding='utf-8')
          old = "function today(){ return new Date().toISOString().slice(0,10); }"
          new = "function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }"
          if old not in app:
              raise SystemExit('Expected today() implementation not found; aborting.')
          app = app.replace(old, new, 1)
          lines = app.splitlines(True)
          spans = [
              ('core.js',1,455), ('shell.js',456,745), ('profiles.js',746,1065),
              ('agenda.js',1066,1116), ('library.js',1117,1142), ('cte.js',1143,1244),
              ('guardias.js',1245,1333), ('students.js',1334,1459), ('attendance.js',1460,1648),
              ('works.js',1649,1826), ('cards.js',1827,1860), ('reports.js',1861,2149),
              ('settings.js',2150,2335), ('bitacora-core.js',2336,2528),
              ('bitacora-ui.js',2529,2690), ('bitacora-form.js',2691,2813),
              ('bitacora-docs.js',2814,len(lines))
          ]
          js = root / 'js'
          js.mkdir(exist_ok=True)
          for name, start, end in spans:
              (js / name).write_text(''.join(lines[start-1:end]), encoding='utf-8')
          rejoined = ''.join((js / name).read_text(encoding='utf-8') for name, _, _ in spans)
          if rejoined != app:
              raise SystemExit('Module split integrity check failed.')

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          scripts = '\n'.join(f'<script src="./js/{name}"></script>' for name,_,_ in spans)
          if '<script src="./app.js"></script>' not in index:
              raise SystemExit('app.js script tag not found in index.html')
          index_path.write_text(index.replace('<script src="./app.js"></script>', scripts), encoding='utf-8')

          def png_chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)
          def make_icon(size, path):
              bg=(30,58,138); fg=(255,255,255); accent=(96,165,250)
              rows=[]
              unit=max(1,size//16)
              def pixel(x,y):
                  for ox,oy in [(2,2),(10,2),(2,10)]:
                      if ox<=x<ox+4 and oy<=y<oy+4:
                          if x in (ox,ox+3) or y in (oy,oy+3): return fg
                          if ox+1<=x<=ox+2 and oy+1<=y<=oy+2: return fg
                  if 7<=x<=8 and 7<=y<=8: return accent
                  if (x+y)%7==0 and 5<=x<=11 and 5<=y<=13: return fg
                  return bg
              for py in range(size):
                  y=min(15,py//unit)
                  row=bytearray([0])
                  for px in range(size):
                      x=min(15,px//unit)
                      row.extend(pixel(x,y))
                  rows.append(bytes(row))
              raw=b''.join(rows)
              png=(b'\x89PNG\r\n\x1a\n' +
                   png_chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,2,0,0,0)) +
                   png_chunk(b'IDAT',zlib.compress(raw,9)) + png_chunk(b'IEND',b''))
              path.write_bytes(png)
          icons=root/'icons'; icons.mkdir(exist_ok=True)
          make_icon(192, icons/'icon-192.png')
          make_icon(512, icons/'icon-512.png')
          (icons/'icon-192-maskable.png').write_bytes((icons/'icon-192.png').read_bytes())
          (icons/'icon-512-maskable.png').write_bytes((icons/'icon-512.png').read_bytes())

          module_paths=[f'./js/{name}' for name,_,_ in spans]
          core=['./','./index.html','./styles.css','./manifest.json','./icons/icon-192.png','./icons/icon-512.png','./icons/icon-192-maskable.png','./icons/icon-512-maskable.png']+module_paths
          sw_head = "const CACHE_VERSION = 'profeqr-v8-7-modular-1';\nconst APP_SHELL = new Request('./index.html');\nconst CORE = " + json.dumps(core, ensure_ascii=False, indent=2) + ";\n"
          sw_tail = """const CDN_LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',
  'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js',
  'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.min.js',
  'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  'https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap'
];
self.addEventListener('install', event => {
  event.waitUntil((async () => {
    const cache = await caches.open(CACHE_VERSION);
    await cache.addAll(CORE);
    await Promise.allSettled(CDN_LIBS.map(url => cache.add(url)));
    await self.skipWaiting();
  })());
});
self.addEventListener('activate', event => {
  event.waitUntil((async () => {
    const keys = await caches.keys();
    await Promise.all(keys.filter(k => k !== CACHE_VERSION).map(k => caches.delete(k)));
    await self.clients.claim();
  })());
});
self.addEventListener('fetch', event => {
  const req = event.request;
  if (req.method !== 'GET') return;
  if (req.mode === 'navigate') {
    event.respondWith((async () => {
      try {
        const fresh = await fetch(req);
        const cache = await caches.open(CACHE_VERSION);
        cache.put(APP_SHELL, fresh.clone());
        return fresh;
      } catch (err) {
        return (await caches.match(APP_SHELL)) || Response.error();
      }
    })());
    return;
  }
  event.respondWith((async () => {
    const cached = await caches.match(req);
    if (cached) return cached;
    try {
      const fresh = await fetch(req);
      if (fresh && fresh.status === 200) {
        const cache = await caches.open(CACHE_VERSION);
        cache.put(req, fresh.clone());
      }
      return fresh;
    } catch (err) {
      return Response.error();
    }
  })());
});
"""
          (root/'sw.js').write_text(sw_head + sw_tail, encoding='utf-8')
          (root/'README.md').write_text("""# ProfeQr

Versión modular estable basada en v8.6.

- Mantiene la clave de almacenamiento `profeqr_v3_comercial` para conservar datos existentes.
- Divide el antiguo `app.js` monolítico en módulos clásicos cargados en orden desde `index.html`.
- Corrige `today()` para usar la fecha local del dispositivo en lugar de UTC.
- Completa los cuatro iconos declarados por la PWA.
- El service worker exige que el núcleo local se almacene correctamente y trata las dependencias CDN como caché opcional.

La modularización es deliberadamente conservadora: no cambia el esquema de datos ni los flujos funcionales.
""", encoding='utf-8')
          app_path.unlink()
          Path('.github/workflows/modularize.yml').unlink()
          PY
      - name: Validate JavaScript
        run: |
          set -e
          for f in js/*.js sw.js; do node --check "$f"; done
          test ! -e app.js
          test -f icons/icon-192.png
          test -f icons/icon-512-maskable.png
      - name: Commit modular version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Modularize ProfeQr application"
          git push origin HEAD:main
