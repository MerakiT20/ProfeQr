name: ProfeQr RC Core 4 and 5

on:
  push:
    branches: [agent/rc-core-4-5-security-writegate]
    paths:
      - '.github/rc_core_4_5.py'
      - '.github/workflows/rc-core-4-5.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python3 .github/rc_core_4_5.py
      - name: Validate JavaScript
        run: |
          for f in js/*.js sw.js; do node --check "$f"; done
      - name: Validate security invariants
        run: |
          grep -q 'pinHash' js/security.js
          grep -q 'restorePersistedDb' js/core.js
          grep -q 'sanitizedBackupDb' js/settings.js
          ! grep -q 'pinBuffer===db.config.pin' js/shell.js
          ! grep -q 'pin: pin' js/shell.js
      - name: Commit migration
        run: |
          rm -f .github/rc_core_4_5.py .github/workflows/rc-core-4-5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden PIN security and centralize write gate'
          git push
