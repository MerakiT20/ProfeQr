name: ProfeQr RC Core 3 Bitacora Integrity

on:
  push:
    branches: [agent/rc-core-3-bitacora-integrity]
    paths:
      - '.github/workflows/rc-core-3-bitacora.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python3 scripts/rc_core3_migrate.py
      - name: Validate
        run: |
          set -e
          for f in js/core.js js/bitacora-ui.js js/bitacora-form.js js/bitacora-docs.js sw.js; do node --check "$f"; done
          grep -q "appendBitacoraVersion" js/core.js
          grep -q "Acta cerrada · solo lectura" js/bitacora-docs.js
          grep -q "status:'borrador'" js/bitacora-ui.js
          grep -q "antes de edición" js/bitacora-docs.js
      - name: Remove migration helpers
        run: rm -f scripts/rc_core3_migrate.py .github/workflows/rc-core-3-bitacora.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Protect Bitacora closed reports with version history"
          git push origin HEAD:agent/rc-core-3-bitacora-integrity
