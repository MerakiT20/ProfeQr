name: Assemble ProfeQr upload

on:
  push:
    paths:
      - '.upload/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble, validate and publish ProfeQr
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .upload/READY ]; then
            echo "No staging payload present; nothing to assemble."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def decode_chunks(pattern):
              parts = sorted(Path('.upload').glob(pattern))
              if not parts:
                  raise SystemExit(f'No payload parts for {pattern}')
              text = ''.join(p.read_text(encoding='ascii') for p in parts)
              return base64.b64decode(text, validate=True)

          app = gzip.decompress(decode_chunks('app.js.gz.b64.*'))
          styles = gzip.decompress(decode_chunks('styles.css.gz.b64.*'))
          files = {
              'app.js': (app, 'b408169880647fd085ef0fb6e62fcb3486517d85a9d338fc2d293a0e46a8316f'),
              'styles.css': (styles, '12ea7268245857e74a298836d8e9d883a3d0bc8eeab319827d7cf91dd831deba'),
              'index.html': (decode_chunks('index.html.b64'), '460e7e0ecc20fab1500a070ec0303cd9724e96071fbb1e877b7d815d17d7aa07'),
              'manifest.json': (decode_chunks('manifest.json.b64'), 'ac6a56bbd8e3739906f87c977d4fca27065f0c638f7ae5b8badb390c26afd3fe'),
              'sw.js': (decode_chunks('sw.js.b64'), 'c02261febf41d8271eeaf40d0bb372bf3ba76e9d36e4965c537e6adb34b72246'),
              '_redirects': (decode_chunks('_redirects.b64'), '6036983e5fc00f0169c9e939b1816ed771eee00e27f2fcc517b819041460b9ef'),
          }
          for name, (data, expected) in files.items():
              actual = sha256(data)
              if actual != expected:
                  raise SystemExit(f'{name}: SHA256 mismatch {actual} != {expected}')
              Path(name).write_bytes(data)
              print(f'{name}: OK {actual}')
          PY

          node --check app.js
          rm -rf .upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace ProfeQr with uploaded version"
          git push
