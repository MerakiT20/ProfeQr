name: Validate RC Core 4 and 5

on:
  push:
    branches: [agent/rc-core-4-5-security-writegate]
    paths:
      - '.github/workflows/validate-rc-core-4-5.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          for f in js/*.js sw.js; do node --check "$f"; done
      - name: Security invariants
        run: |
          grep -q 'PBKDF2' js/security.js
          grep -q 'PIN_KDF_ITERATIONS = 120000' js/security.js
          grep -q 'restorePersistedDb' js/core.js
          grep -q 'sanitizedBackupDb' js/settings.js
          ! grep -q 'pinBuffer===db.config.pin' js/shell.js
          ! grep -q 'pin: pin' js/shell.js
