name: ProfeQr PDF.js Viewer
on:
  push:
    branches: [agent/pdf-viewer-pdfjs]
    paths:
      - '.github/workflows/pdfjs-viewer.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PDF.js 6.1.200
        run: |
          mkdir -p vendor/pdfjs
          npm pack pdfjs-dist@6.1.200 >/tmp/pdfpkg.txt
          PKG=$(tail -n1 /tmp/pdfpkg.txt)
          tar -xzf "$PKG"
          cp package/build/pdf.mjs vendor/pdfjs/pdf.mjs
          cp package/build/pdf.worker.mjs vendor/pdfjs/pdf.worker.mjs
          rm -rf package "$PKG"
      - name: Apply viewer patch
        run: python3 .tmp_pdfviewer.py
      - name: Validate
        run: |
          node --check js/documents.js
          node --check sw.js
          test -s vendor/pdfjs/pdf.mjs
          test -s vendor/pdfjs/pdf.worker.mjs
          grep -q "renderPdfInsideApp" js/documents.js
          grep -q "pdf.worker.mjs" sw.js
          ! grep -q "<iframe src" js/documents.js
      - name: Commit viewer
        run: |
          rm -f .tmp_pdfviewer.py .github/workflows/pdfjs-viewer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Render PDFs inside ProfeQr with PDF.js'
          git push
