name: ProfeQr RC Core 9 Documents
on:
  push:
    branches: [agent/rc-core-9-documents]
    paths:
      - '.github/workflows/rc-core-9.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Core 9 integration
        run: python3 .tmp_rc9.py
      - name: Validate JavaScript
        run: |
          for f in js/*.js sw.js; do node --check "$f"; done
      - name: Validate Documents invariants
        run: |
          grep -q "PROFEQR_FILES_DB='profeqr-files-db'" js/documents.js
          grep -q "currentScreen==='documents'" js/profiles.js
          grep -q "navBtn('documents'" js/shell.js
          grep -q "./js/documents.js" index.html
          grep -q "./js/documents.js" sw.js
          grep -q "PROFEQR_BACKUP_VERSION=2" js/backup.js
          grep -q "backupDocuments" js/backup.js
          grep -q "restoreBackupDocuments" js/backup.js
      - name: Commit Core 9
        run: |
          rm -f .tmp_rc9.py .github/workflows/rc-core-9.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish Documents manager and backup integration'
          git push
