name: Build ProfeQr Android APK

on:
  push:
    branches:
      - codex/android-apk-8.8
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify APK
        run: |
          mkdir -p release
          SIGNING_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v -keystore release/profeqr-release.jks -storepass "$SIGNING_PASSWORD" -keypass "$SIGNING_PASSWORD" -alias profeqr -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=ProfeQr, OU=Telesecundaria Federal 20, O=ProfeQr, L=Leon, ST=Guanajuato, C=MX"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk release/ProfeQr-8.8-stable-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks release/profeqr-release.jks --ks-key-alias profeqr --ks-pass "pass:$SIGNING_PASSWORD" --key-pass "pass:$SIGNING_PASSWORD" --out release/ProfeQr-8.8-stable.apk release/ProfeQr-8.8-stable-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/ProfeQr-8.8-stable.apk
          sha256sum release/ProfeQr-8.8-stable.apk > release/ProfeQr-8.8-stable.apk.sha256
          printf '%s\n' "$SIGNING_PASSWORD" > release/keystore-password.txt
          cd release
          zip -q ProfeQr-android-signing-backup.zip profeqr-release.jks keystore-password.txt
          rm ProfeQr-8.8-stable-aligned.apk profeqr-release.jks keystore-password.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ProfeQr-8.8-Android
          path: |
            release/ProfeQr-8.8-stable.apk
            release/ProfeQr-8.8-stable.apk.sha256
            release/ProfeQr-android-signing-backup.zip
          if-no-files-found: error
          retention-days: 7
