name: ProfeQr RC10 Cleanup
on:
  push:
    branches: [agent/rc-core-10-tests]
    paths: ['.github/workflows/rc10-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove CI-only generated dependencies
        run: |
          git rm -r --ignore-unmatch node_modules package.json package-lock.json
          cat > .gitignore <<'EOF'
node_modules/
package.json
package-lock.json
EOF
          rm -f .github/workflows/rc10-cleanup.yml
      - name: Verify release tree hygiene
        run: |
          test ! -d node_modules
          test ! -f package.json
          test -f tests/rc-core-10.mjs
          test -f .github/workflows/release-candidate-tests.yml
          grep -q 'playwright@1.55.0' .github/workflows/release-candidate-tests.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean Core 10 CI artifacts'
          git push
