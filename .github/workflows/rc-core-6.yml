name: ProfeQr RC Core 6
on:
  push:
    branches: [agent/rc-core-6-licensing]
    paths:
      - '.github/workflows/rc-core-6.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Core 6
        run: python3 .github/core6_migrate.py
      - name: Validate JavaScript
        run: |
          for f in js/*.js sw.js; do node --check "$f"; done
      - name: Validate licensing invariants
        run: |
          grep -q 'ECDSA' js/license.js
          grep -q 'installationId' js/license.js
          grep -q 'licenseLegacyGrandfathered' js/shell.js
          grep -q 'activateLicenseToken' js/settings.js
          grep -q './js/license.js' index.html
          grep -q './js/license.js' sw.js
          ! grep -q 'function licenseExpiryDate(){ return db?.config?.license?.expiresAt || LICENSE_END; }' js/core.js
      - name: Commit Core 6
        run: |
          rm -f .github/core6_migrate.py .github/workflows/rc-core-6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add signed offline licensing and activation' || exit 0
          git push
